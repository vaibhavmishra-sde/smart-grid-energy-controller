services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 5 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_grid
      POSTGRES_USER: smart_grid
      POSTGRES_PASSWORD: change_me_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_grid -d smart_grid"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      PORT: 5000
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://smart_grid:change_me_local_only@postgres:5432/smart_grid
      SIMULATED_SENSORS: 1000
      TELEMETRY_INTERVAL_MS: 1000
      ENABLE_AUTO_PROTECTION: "true"
      MAX_VOLTAGE: 250
      MIN_VOLTAGE: 210
      MAX_POWER: 5000
      JWT_SECRET: change_me_before_production
    ports:
      - "5000:5000"
    depends_on:
      mosquitto:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  simulator:
    build: ./simulator
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      SIMULATED_SENSORS: 1000
      TELEMETRY_INTERVAL_MS: 1000
    depends_on:
      mosquitto:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mosquitto_data:
  redis_data:
  postgres_data:

